# XcodeGen spec — MeloNX for tvOS (tvOS 16, TrollStore)
#
#   xcodegen generate --spec project-tvos.yml   →  MeloNX-tvOS.xcodeproj
#
# The tvOS app is NOT the iOS SwiftUI app patched file by file. It compiles the
# emulator-facing core of the iOS app unchanged —
#     Core/Ryujinx.swift          C# bridge (main_ryujinx_sdl, gamepads, firmware…)
#     Core/Models/**              Options, NativeOptions.h types, GameInfo, mappings
#     Core/Controllers (native)   GCController → core input, rumble, controller gyro
#     Core/Callbacks              C# → Swift callbacks (rumble)
# — and adds a small TV front end in tvos/App (library, launch gate, game view).
#
# Built by .github/workflows/build-tvos.yml, which first produces
#     tvos/deps/out/tvos/*                         (tvos/scripts/build-deps.sh)
#     src/Ryujinx.Library/bin/.../tvos-arm64/native/Ryujinx.Library.dylib
#                                                  (dotnet publish -r tvos-arm64)

name: MeloNX-tvOS
options:
  bundleIdPrefix: com.sojubada
  deploymentTarget:
    tvOS: "16.0"
  createIntermediateGroups: true

packages:
  # Two plain types from stossy11/Melo-Controller; see the package's Package.swift.
  Melo-Controller:
    path: tvos/packages/MeloControllerCore

targets:
  MeloNX-tvOS:
    type: application
    platform: tvOS

    sources:
      - path: tvos/App
      - path: src/MeloNX/MeloNX/Core/Ryujinx.swift
      - path: src/MeloNX/MeloNX/Core/Models
      - path: src/MeloNX/MeloNX/Core/Callbacks
      - path: src/MeloNX/MeloNX/Core/Controllers/BaseController.swift
      - path: src/MeloNX/MeloNX/Core/Controllers/NativeController.swift
      - path: src/MeloNX/MeloNX/Core/Controllers/ControllerMappingStore.swift
      - path: src/MeloNX/MeloNX/Core/Controllers/Motion
      - path: src/MeloNX/MeloNX/Core/Controllers/Rumble
      - path: src/MeloNX/MeloNX/Common/EntitlementChecker.swift
      - path: src/MeloNX/MeloNX/Common/Models/GameFileType.swift

    dependencies:
      # .NET NativeAOT core (dotnet publish -r tvos-arm64)
      - framework: src/Ryujinx.Library/bin/Release/net10.0/tvos-arm64/native/Ryujinx.Library.dylib
        embed: true
        codeSign: false
      # Loaded at runtime by the core:
      #   Library.cs  NativeLibrary.Load("@rpath/SDL3.framework/SDL3")
      - framework: tvos/deps/out/tvos/SDL3.xcframework
        embed: true
        codeSign: false
      #   MVKInitialization.cs  [LibraryImport("libMoltenVK.dylib")]
      - framework: tvos/deps/out/tvos/libMoltenVK.dylib
        embed: true
        codeSign: false
      #   FFmpegApi.cs  "avcodec" / "avutil" — Nvdec video only (cut-scenes);
      #   prune-optional-deps.sh drops these two when FFmpeg did not build.
      - framework: tvos/deps/out/tvos/libavcodec.dylib
        embed: true
        codeSign: false
      - framework: tvos/deps/out/tvos/libavutil.dylib
        embed: true
        codeSign: false
      - package: Melo-Controller
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
      - sdk: AVFoundation.framework
      - sdk: MetalKit.framework

    settings:
      base:
        PRODUCT_NAME: MeloNX                 # module name must stay MeloNX (Ryujinx.swift calls MeloNX.initialize() etc.)
        PRODUCT_BUNDLE_IDENTIFIER: com.sojubada.melonx.tvos
        # Use the hand-written plist as is. (XcodeGen's `info:` key would regenerate
        # and overwrite it, dropping the game-controller keys.)
        INFOPLIST_FILE: tvos/Info-tvOS.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "2.7.0"
        CURRENT_PROJECT_VERSION: "1"
        TVOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "3"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        # Same Swift settings as the iOS target (MeloNX.xcodeproj), so the shared
        # core files compile the way they do upstream.
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_OBJC_BRIDGING_HEADER: tvos/App/MeloNX-tvOS-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/src/MeloNX/MeloNX/Core"
        # libMoltenVK / libavcodec / libavutil are linked as -l<name>, like the iOS target
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/tvos/deps/out/tvos"
          - "$(SRCROOT)/src/Ryujinx.Library/bin/Release/net10.0/tvos-arm64/native"
        CLANG_ENABLE_MODULES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # Signed afterwards with ldid + the TrollStore entitlements (package-tipa.sh)
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_BITCODE: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  MeloNX-tvOS:
    build:
      targets:
        MeloNX-tvOS: all
    run:
      config: Release
    archive:
      config: Release
